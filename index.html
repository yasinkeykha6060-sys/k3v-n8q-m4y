<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff85ad">
  <title>نیایش جانم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Harmattan:wght@400;700&family=Lalezar&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="spark s1"></div>
    <div class="spark s2"></div>
    <div class="spark s3"></div>
    <div class="spark s4"></div>
    <i class="float-heart">💗</i>
    <i class="float-heart">♡</i>
    <i class="float-heart">💗</i>
    <i class="float-heart">♡</i>
    <i class="float-heart">💗</i>
    <i class="float-heart">♡</i>
  </div>
  <div class="art" id="art" hidden></div>
  <div class="progress" id="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <button class="mute" id="mute" type="button" aria-label="موسیقی">🎵</button>
  <div class="loader" id="loader" hidden aria-hidden="true">💗</div>
  <p class="toast" id="toast" hidden></p>
  <main id="stage"></main>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
